# GitHub Actions -> Cloud Run, blue/green, no service-account key.
# Push to main: test -> build -> deploy "green" (0% traffic) -> health check -> promote to 100% -> git tag vX.Y.Z.
# Version comes from the VERSION file; bump it (and CHANGELOG.md) to release a new version.
# If the health check fails, traffic never moves: users stay on the old revision.
# Manual rollback: Actions > deploy > Run workflow > action = rollback.
# One-time setup in Cloud Shell: ./deploy/04-setup-github-ci.sh
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: "rollback = send 100% traffic back to the previous revision; promote = send 100% to green"
        type: choice
        options: [rollback, promote]

# Not secrets: project id, region, and the keyless-auth identifiers.
env:
  PROJECT_ID: health-log-demo
  REGION: asia-southeast1
  REPO: health
  WIF_PROVIDER: projects/5526432093/locations/global/workloadIdentityPools/github/providers/github-provider
  DEPLOYER_SA: gha-deployer@health-log-demo.iam.gserviceaccount.com

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # lets the job request a GitHub OIDC token for Workload Identity Federation

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci && npm run build && npm test --if-present
        working-directory: ${{ matrix.app }}

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the vX.Y.Z git tag
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION must be X.Y.Z, got '$V'"; exit 1; }
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "GIT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          # Readable, unique revision names in the Cloud Run console, e.g. health-api-v1-0-0-abc1234-1
          echo "REV_SUFFIX=v${V//./-}-${GITHUB_SHA::7}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build images (Cloud Build)
        run: |
          gcloud config set project "$PROJECT_ID"
          REG="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO"; TAG="${GITHUB_SHA::7}"
          gcloud builds submit api --tag "$REG/api:$TAG" --quiet
          gcloud builds submit web --tag "$REG/web:$TAG" --quiet
      - name: Deploy green (0% traffic)
        run: |
          REG="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO"; TAG="${GITHUB_SHA::7}"
          VARS="APP_VERSION=$APP_VERSION,GIT_SHA=$GIT_SHA"
          gcloud run deploy health-api --region "$REGION" --image "$REG/api:$TAG" --no-traffic --tag green \
            --revision-suffix "$REV_SUFFIX" --update-env-vars "$VARS" --quiet
          gcloud run deploy health-web --region "$REGION" --image "$REG/web:$TAG" --no-traffic --tag green \
            --revision-suffix "$REV_SUFFIX" --update-env-vars "$VARS" --quiet
      - name: Health check green
        run: |
          API=$(gcloud run services describe health-api --region "$REGION" --format='value(status.url)')
          WEB=$(gcloud run services describe health-web --region "$REGION" --format='value(status.url)')
          GA="${API/https:\/\//https://green---}"; GW="${WEB/https:\/\//https://green---}"
          for i in 1 2 3 4 5 6; do curl -fsS "$GA/readyz" && break; echo "retry $i"; sleep 10; done
          curl -fsS "$GA/readyz"
          curl -fsS -o /dev/null "$GW/"
          # Make sure green really runs the version we just built.
          GOT=$(curl -fsS "$GA/version")
          echo "$GOT"
          echo "$GOT" | grep -q "\"version\":\"$APP_VERSION\"" || { echo "green reports wrong version"; exit 1; }
          echo "$GOT" | grep -q "\"commit\":\"$GIT_SHA\"" || { echo "green reports wrong commit"; exit 1; }
          echo "green API: $GA ($GOT)" >> "$GITHUB_STEP_SUMMARY"
      - name: Promote green to 100%
        run: |
          gcloud run services update-traffic health-api --region "$REGION" --to-tags green=100 --quiet
          gcloud run services update-traffic health-web --region "$REGION" --to-tags green=100 --quiet
          echo "Promoted v$APP_VERSION ($GIT_SHA) to 100%. Roll back: Actions > deploy > Run workflow > rollback" >> "$GITHUB_STEP_SUMMARY"
      - name: Tag release v${{ env.APP_VERSION }}
        run: |
          T="v$APP_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$T" >/dev/null; then
            echo "Tag $T already exists (bump VERSION for a new release)" >> "$GITHUB_STEP_SUMMARY"
          else
            git tag "$T" "$GITHUB_SHA" && git push origin "$T"
            echo "Tagged $T" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: ${{ inputs.action }}
        run: |
          gcloud config set project "$PROJECT_ID"
          for s in health-api health-web; do
            if [ "${{ inputs.action }}" = promote ]; then
              gcloud run services update-traffic $s --region "$REGION" --to-tags green=100 --quiet
            else
              PREV=$(gcloud run revisions list --service $s --region "$REGION" --sort-by=~metadata.creationTimestamp --format='value(metadata.name)' | sed -n 2p)
              gcloud run services update-traffic $s --region "$REGION" --to-revisions "$PREV=100" --quiet
            fi
          done
