<text x="300" y="553" text-anchor="start" font-size="11.5" font-weight="400" fill="#5d6560">ตรวจ ID token กับ Google</text>
<path d="M755 385 L790 385 L790 148 L1270 148 L1270 300" fill="none" stroke="#7d8581" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M1170 510 L970 510" fill="none" stroke="#7d8581" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<circle cx="830" cy="240" r="11" fill="#1f6f5c"/><text x="830" y="244.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
<text x="30" y="650" text-anchor="start" font-size="15" font-weight="600" fill="#1d2320">ลำดับ request</text>
<text x="30" y="676" text-anchor="start" font-size="13" font-weight="400" fill="#33403a">1  เปิดเว็บ: Browser → Google Front End → health-web (ได้หน้าเว็บ + URL ของ API)</text>
<text x="30" y="700" text-anchor="start" font-size="13" font-weight="400" fill="#33403a">2  Login: Browser ขอ ID token จาก Google → health-api ตรวจ → บันทึก user → ออก JWT</text>
<text x="30" y="724" text-anchor="start" font-size="13" font-weight="400" fill="#33403a">3  ทุก request: health-api นับใน Redis · เกิน 60 ครั้ง/นาที → 429 + Retry-After</text>
<text x="30" y="748" text-anchor="start" font-size="13" font-weight="400" fill="#33403a">4  Waiting room: เข้าคิวใน Redis · ปล่อย 20 คน/วินาที · ได้ตั๋วคิว (ไม่มีตั๋ว → 428)</text>
<text x="30" y="772" text-anchor="start" font-size="13" font-weight="400" fill="#33403a">5  Readings: มี JWT + ตั๋ว → อ่าน/เขียน MongoDB Atlas</text>
<text x="760" y="650" text-anchor="start" font-size="15" font-weight="600" fill="#1d2320">Load balancer อยู่ตรงไหน</text>
<text x="760" y="676" text-anchor="start" font-size="13" font-weight="400" fill="#33403a">Google Front End หน้า Cloud Run ทำหน้าที่ load balancer ให้เลย:</text>
<text x="760" y="700" text-anchor="start" font-size="13" font-weight="400" fill="#33403a">รับ HTTPS, กระจาย request ไป instance, scale ตามโหลด</text>
<text x="760" y="724" text-anchor="start" font-size="13" font-weight="400" fill="#33403a">ไม่ได้สร้าง External Application LB แยก (ประหยัดค่า LB รายเดือน)</text>
<text x="760" y="748" text-anchor="start" font-size="13" font-weight="400" fill="#33403a">ควรเพิ่มเมื่อ: ใช้ domain ของบริษัท · Cloud Armor (WAF) · CDN · หลาย region</text>
<text x="760" y="772" text-anchor="start" font-size="13" font-weight="400" fill="#33403a">Health check: /readyz ผ่านก่อนรับ traffic · /healthz ไม่ตอบ → restart</text>
